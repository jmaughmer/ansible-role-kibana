---
# kibana-keystore cannot print stored values, so the role keeps a salted
# SHA-256 of each managed value in a root-only state file to detect changes.

- name: Keystore | Check keystore file
  ansible.builtin.stat:
    path: "{{ _kb_keystore_path }}"
  register: _kb_ks_file

- name: Keystore | Read keystore state
  ansible.builtin.slurp:
    src: "{{ _kb_keystore_state_file }}"
  register: _kb_ks_state_raw
  failed_when: false

- name: Keystore | Load keystore state
  ansible.builtin.set_fact:
    _kb_ks_state: >-
      {{ (_kb_ks_state_raw.content | b64decode | from_json)
         if (_kb_ks_state_raw.content is defined and _kb_ks_file.stat.exists) else {} }}
    _kb_ks_hashes: {}

- name: Keystore | Choose checksum salt
  ansible.builtin.set_fact:
    _kb_ks_salt: >-
      {{ _kb_ks_state.salt | default(lookup('ansible.builtin.password', '/dev/null',
                                            chars=['ascii_letters', 'digits'], length=32)) }}

- name: Keystore | Compute checksums of desired entries
  ansible.builtin.set_fact:
    _kb_ks_hashes: "{{ _kb_ks_hashes | combine({item.key: (_kb_ks_salt ~ item.key ~ item.value) | hash('sha256')}) }}"
  loop: "{{ _kb_keystore_desired | dict2items }}"
  no_log: true

- name: Keystore | Create keystore
  ansible.builtin.command:
    argv:
      - "{{ kibana_home }}/bin/kibana-keystore"
      - create
      - --silent
  environment: "{{ _kb_cli_env }}"
  register: _kb_ks_created
  when: not _kb_ks_file.stat.exists

- name: Keystore | List entries
  ansible.builtin.command:
    argv:
      - "{{ kibana_home }}/bin/kibana-keystore"
      - list
  environment: "{{ _kb_cli_env }}"
  register: _kb_ks_list
  changed_when: false
  check_mode: false

- name: Keystore | Work out keystore changes
  ansible.builtin.set_fact:
    _kb_ks_current: "{{ _kb_ks_list.stdout_lines | map('trim') | select('match', '^[A-Za-z0-9_.-]+$') | list }}"
    # new entries, or entries whose value differs from the recorded checksum
    _kb_ks_update: >-
      {{ ((_kb_ks_hashes | dict2items | difference(_kb_ks_state.entries | default({}) | dict2items)
           | map(attribute='key') | list)
          + (_kb_ks_hashes.keys() | list | difference(_kb_ks_list.stdout_lines | map('trim') | list))) | unique }}

- name: Keystore | Add new and changed entries
  ansible.builtin.command:
    argv:
      - "{{ kibana_home }}/bin/kibana-keystore"
      - add
      - "{{ item.key }}"
      - --stdin
      - --force
    stdin: "{{ item.value }}"
    stdin_add_newline: false
  environment: "{{ _kb_cli_env }}"
  loop: "{{ _kb_keystore_desired | dict2items }}"
  when: item.key in _kb_ks_update
  register: _kb_ks_added
  no_log: "{{ kibana_no_log }}"

- name: Keystore | Remove unmanaged entries
  ansible.builtin.command:
    argv:
      - "{{ kibana_home }}/bin/kibana-keystore"
      - remove
      - "{{ item }}"
  environment: "{{ _kb_cli_env }}"
  loop: "{{ _kb_ks_current | difference(_kb_ks_hashes.keys() | list) if kibana_keystore_purge | bool else [] }}"
  register: _kb_ks_removed

- name: Keystore | Record checksums
  ansible.builtin.copy:
    content: "{{ {'salt': _kb_ks_salt, 'entries': _kb_ks_hashes} | to_nice_json }}"
    dest: "{{ _kb_keystore_state_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Keystore | Ensure keystore permissions
  ansible.builtin.file:
    path: "{{ _kb_keystore_path }}"
    owner: root
    group: kibana
    mode: "0660"

- name: Keystore | Flag restart for keystore changes
  ansible.builtin.set_fact:
    _kb_restart_required: true
  when: _kb_ks_created is changed or _kb_ks_added is changed or _kb_ks_removed is changed
