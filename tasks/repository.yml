---
# Package source (kibana_repo_source): elastic or satellite. With `none`
# this file is not included.

# ------------------------------------------------------------------ elastic
- name: Repository | Elastic repository
  when:
    - kibana_repo_source == 'elastic'
    - _kb_pkg_mgr == 'dnf'
  block:
    - name: Repository | Import Elastic GPG key
      ansible.builtin.rpm_key:
        key: "{{ kibana_repo_gpgkey }}"
        state: present
      register: _kb_rpm_key
      until: _kb_rpm_key is not failed
      retries: "{{ kibana_task_retries }}"
      delay: "{{ kibana_task_delay }}"
      when: kibana_repo_gpgcheck | bool

    # Disabled by default so `dnf update` never upgrades Kibana outside the role.
    - name: Repository | Configure Kibana repository
      ansible.builtin.yum_repository:
        name: "{{ _kb_repo_name }}"
        description: "Elastic {{ _kb_major_version }}.x packages (Kibana)"
        file: kibana
        baseurl: "{{ kibana_repo_baseurl }}"
        gpgcheck: "{{ kibana_repo_gpgcheck | bool }}"
        gpgkey: "{{ kibana_repo_gpgkey }}"
        timeout: "{{ kibana_repo_timeout }}"
        retries: "{{ kibana_repo_retries }}"
        enabled: false

# -------------------------------------------------------------- elastic, apt
# apt has no per-command repository switch, so the source stays enabled and the
# package is held instead (install.yml), which keeps `apt upgrade` away from it.
- name: Repository | Elastic apt repository
  when:
    - kibana_repo_source == 'elastic'
    - _kb_pkg_mgr == 'apt'
  block:
    - name: Repository | Create the apt keyring directory
      ansible.builtin.file:
        path: "{{ _kb_apt_keyring | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: kibana_repo_gpgcheck | bool

    # Downloaded once; delete the file to fetch a rotated key.
    - name: Repository | Download Elastic GPG key
      ansible.builtin.get_url:
        url: "{{ kibana_repo_gpgkey }}"
        dest: "{{ _kb_apt_keyring }}"
        force: false
        owner: root
        group: root
        mode: "0644"
      register: _kb_apt_key
      until: _kb_apt_key is not failed
      retries: "{{ kibana_task_retries }}"
      delay: "{{ kibana_task_delay }}"
      when: kibana_repo_gpgcheck | bool

    - name: Repository | Configure Elastic apt source
      ansible.builtin.copy:
        dest: "{{ _kb_apt_source }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: {{ kibana_repo_baseurl }}
          Suites: stable
          Components: main
          {{ ('Signed-By: ' ~ _kb_apt_keyring) if kibana_repo_gpgcheck | bool else 'Trusted: yes' }}
      register: _kb_apt_source_file

    - name: Repository | Update the apt package index
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: "{{ kibana_dnf_lock_timeout }}"
      register: _kb_apt_update
      until: _kb_apt_update is not failed
      retries: "{{ kibana_task_retries }}"
      delay: "{{ kibana_task_delay }}"
      when: _kb_apt_source_file is changed or _kb_apt_key is changed

# ---------------------------------------------------------------- satellite
# The repository comes from Red Hat Satellite / Katello through
# subscription-manager, which owns redhat.repo. The role only reads it, and
# changes it through subscription-manager (enabled state, content overrides).
- name: Repository | Red Hat Satellite / Katello repository
  when: kibana_repo_source == 'satellite'
  block:
    # Installed by default on RHEL; AlmaLinux and Rocky Linux hosts get it when
    # they are registered to Katello.
    - name: Repository | Check for subscription-manager
      ansible.builtin.stat:
        path: /usr/sbin/subscription-manager
      register: _kb_sat_subman

    - name: Repository | Verify subscription-manager is installed
      ansible.builtin.assert:
        that:
          - _kb_sat_subman.stat.exists
        fail_msg: >-
          kibana_repo_source is satellite, but subscription-manager is not installed on
          {{ inventory_hostname }} ({{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}). Install it and register the host to
          Red Hat Satellite or Katello first.
        quiet: true

    # Prevents installing from two sources after switching from the public repository
    - name: Repository | Remove the role's Elastic repository definition
      ansible.builtin.yum_repository:
        name: "{{ _kb_repo_name }}"
        file: kibana
        state: absent

    - name: Repository | Look up the Satellite repository
      ansible.builtin.script:
        cmd: "repo_lookup.py {{ kibana_satellite_repo_id | quote }} elastic kibana"
        executable: "{{ _kb_python }}"
      register: _kb_sat_lookup
      until: _kb_sat_lookup is not failed
      retries: "{{ kibana_task_retries }}"
      delay: "{{ kibana_task_delay }}"
      changed_when: false
      check_mode: false

    # New content (e.g. a freshly promoted content view) reaches redhat.repo
    # only after subscription-manager refreshes.
    - name: Repository | Refresh subscription-manager content
      ansible.builtin.command:
        cmd: subscription-manager refresh
      register: _kb_sat_refresh
      changed_when: true
      until: _kb_sat_refresh is not failed
      retries: "{{ kibana_task_retries }}"
      delay: "{{ kibana_task_delay }}"
      when:
        - not (_kb_sat_lookup.stdout | from_json).found
        - kibana_satellite_refresh | bool

    - name: Repository | Look up the Satellite repository after refresh
      ansible.builtin.script:
        cmd: "repo_lookup.py {{ kibana_satellite_repo_id | quote }} elastic kibana"
        executable: "{{ _kb_python }}"
      register: _kb_sat_lookup_refreshed
      until: _kb_sat_lookup_refreshed is not failed
      retries: "{{ kibana_task_retries }}"
      delay: "{{ kibana_task_delay }}"
      changed_when: false
      check_mode: false
      when: _kb_sat_refresh is changed  # noqa: no-handler - the lookup is needed by the next task

    - name: Repository | Record Satellite repository state
      ansible.builtin.set_fact:
        _kb_sat_repo: >-
          {{ ((_kb_sat_lookup_refreshed if _kb_sat_refresh is changed else _kb_sat_lookup).stdout) | from_json }}

    - name: Repository | Verify the Satellite repository is available
      ansible.builtin.assert:
        that:
          - _kb_sat_repo.found
        fail_msg: >-
          Repository '{{ kibana_satellite_repo_id }}' is not available on {{ inventory_hostname }}.
          Check that the host is registered to Satellite and that its content view and lifecycle
          environment include the repository (`subscription-manager repos --list`).
          {% if _kb_sat_repo.candidates | length > 0 %}Repository ids on this host that look related:
          {{ _kb_sat_repo.candidates | join(', ') }}.{% endif %}
        quiet: true

    - name: Repository | Set the Satellite repository enabled state
      ansible.builtin.command:
        argv:
          - subscription-manager
          - repos
          - "--{{ 'enable' if kibana_satellite_repo_state == 'enabled' else 'disable' }}={{ kibana_satellite_repo_id }}"
      register: _kb_sat_repo_state
      until: _kb_sat_repo_state is not failed
      retries: "{{ kibana_task_retries }}"
      delay: "{{ kibana_task_delay }}"
      changed_when: true
      when:
        - kibana_satellite_repo_state != 'unmanaged'
        - _kb_sat_repo.enabled != (kibana_satellite_repo_state == 'enabled')

    - name: Repository | Apply Satellite content overrides
      ansible.builtin.command:
        argv:
          - subscription-manager
          - repo-override
          - "--repo={{ kibana_satellite_repo_id }}"
          - "--add={{ item.key }}:{{ item.value }}"
      loop: "{{ kibana_satellite_repo_overrides | dict2items }}"
      loop_control:
        label: "{{ item.key }}={{ item.value }}"
      register: _kb_sat_overrides
      until: _kb_sat_overrides is not failed
      retries: "{{ kibana_task_retries }}"
      delay: "{{ kibana_task_delay }}"
      changed_when: true
      when: (_kb_sat_repo.options[item.key | lower] | default('') | string) != (item.value | string)

    - name: Repository | Import GPG key for the Satellite repository
      ansible.builtin.rpm_key:
        key: "{{ kibana_satellite_gpgkey }}"
        state: present
      register: _kb_sat_rpm_key
      until: _kb_sat_rpm_key is not failed
      retries: "{{ kibana_task_retries }}"
      delay: "{{ kibana_task_delay }}"
      when: kibana_satellite_gpgkey | length > 0
