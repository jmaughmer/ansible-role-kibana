---
# Resilience settings for hosts behind high-latency, low-bandwidth satellite
# links. The role defaults suit ordinary networks; these values trade run time
# for tolerance of slow and flaky links. Connection-level settings (SSH
# reconnects, keepalives, timeouts) are in ../ansible.cfg.
#
# Rough worst-case per retried task: retries x (delay + attempt duration).

# Retries for downloads (GPG key, packages) and Elasticsearch calls
kibana_task_retries: 8
kibana_task_delay: 60

# Package downloads run as async jobs: they keep running on the host when the
# SSH session drops and Ansible polls for the result.
kibana_download_async_timeout: 14400    # 4 h per attempt
kibana_download_async_poll: 60

# dnf per-request timeout and download retries. dnf aborts a download slower
# than its minimum rate (1 kB/s) only after `timeout` seconds.
kibana_repo_timeout: 600
kibana_repo_retries: 20
kibana_dnf_lock_timeout: 1800

# With kibana_repo_source: satellite the repository comes from redhat.repo, which
# cannot be edited; set its dnf timeout/retries as Satellite content overrides:
# kibana_satellite_repo_overrides:
#   timeout: "600"
#   retries: "20"

# Per-request HTTP timeout for Elasticsearch and Kibana status calls
kibana_api_timeout: 180

# Polling loops that wait for Kibana to become ready and to stop
kibana_ready_retries: 180
kibana_ready_delay: 20
kibana_stop_retries: 180
kibana_stop_delay: 20
