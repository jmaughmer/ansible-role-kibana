---
# Cloud images finish first-boot setup in the background, so wait for it.
- name: Wait for cloud-init
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

# The roles and tests reach the other hosts by inventory name, so give every
# VM the others' addresses directly.
- name: Make the VMs resolve each other by name
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Add every VM to /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} molecule hosts"
        block: |
          {% for host in groups['all'] %}
          {{ hostvars[host].ansible_host }} {{ host }}
          {% endfor %}

# vm.max_map_count is the container host's in the container scenarios; on a
# VM it is the VM's own (65530 on a fresh AlmaLinux), too low for
# Elasticsearch. Raise it for this boot only, as on the container host.
- name: Raise vm.max_map_count for this boot
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Set vm.max_map_count
      ansible.builtin.command: sysctl -w vm.max_map_count=262144
      changed_when: true

- name: Prepare as in the default scenario
  ansible.builtin.import_playbook: ../default/prepare.yml

# fapolicyd with its default rules, on the Kibana hosts. allow_filesystem_mark
# = 1, because the package's unit sets PrivateTmp, and fapolicyd's default
# mount marks do not cover the service's own mount namespace (see the
# README). The daemon runs in the foreground with --debug-deny, so the journal
# names every file it denies, which audit records do not; verify.yml reads it.
- name: Run fapolicyd
  hosts: kibana
  gather_facts: false
  become: true
  tasks:
    - name: Install fapolicyd
      ansible.builtin.dnf:
        name: fapolicyd
        state: present

    - name: Watch whole filesystems
      ansible.builtin.lineinfile:
        path: /etc/fapolicyd/fapolicyd.conf
        regexp: '^\s*allow_filesystem_mark\s*='
        line: allow_filesystem_mark = 1

    - name: Create the drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/fapolicyd.service.d
        state: directory
        mode: "0755"

    - name: Log every denial with its path
      ansible.builtin.copy:
        dest: /etc/systemd/system/fapolicyd.service.d/molecule.conf
        mode: "0644"
        content: |
          [Service]
          Type=simple
          PIDFile=
          ExecStart=
          ExecStart=/usr/sbin/fapolicyd --debug-deny

    - name: Start fapolicyd
      ansible.builtin.systemd_service:
        name: fapolicyd
        state: started
        enabled: true
        daemon_reload: true
