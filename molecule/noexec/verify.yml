---
- name: Verify as in the default scenario
  ansible.builtin.import_playbook: ../default/verify.yml

- name: Verify Kibana runs without an executable /tmp
  hosts: kibana
  gather_facts: false
  tasks:
    - name: Read the mount options of /tmp
      ansible.builtin.command:
        argv: [findmnt, --noheadings, --output, OPTIONS, --target, /tmp]
      register: test_tmp_options
      changed_when: false

    - name: Check /tmp is still noexec
      ansible.builtin.assert:
        that:
          - "'noexec' in test_tmp_options.stdout.split(',')"

    # Not a bare "noexec": the host names contain it, and Kibana logs them.
    - name: Look for native code that failed to load
      ansible.builtin.shell: >-
        set -o pipefail;
        journalctl --unit kibana --boot --no-pager --output cat
        | grep -iE 'failed to map segment|ERR_DLOPEN_FAILED'
      args:
        executable: /bin/bash
      register: test_load_errors
      changed_when: false
      failed_when: test_load_errors.rc not in [0, 1]

    - name: Check none did
      ansible.builtin.assert:
        that:
          - test_load_errors.rc == 1
        fail_msg: "{{ test_load_errors.stdout_lines }}"

    - name: Find Reporting's headless Chromium
      ansible.builtin.find:
        paths: /usr/share/kibana
        patterns: headless_shell
        file_type: file
        recurse: true
      register: test_chromium

    # As Reporting runs it: as kibana, with its profile in the temporary
    # directory and shared memory in /dev/shm, both noexec here, driven over
    # the DevTools protocol. (--dump-dom and --screenshot hang in a container.)
    # timeout stops it after the checks.
    - name: Start it
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - kibana
          - --
          - timeout
          - "120"
          - "{{ test_chromium.files[0].path }}"
          - --headless
          - --no-sandbox
          - --disable-gpu
          - --user-data-dir=/tmp/molecule-chromium
          - --remote-debugging-port=9333
          - about:blank
      async: 150
      poll: 0
      changed_when: false

    - name: Wait for its DevTools endpoint
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9333
        timeout: 60

    - name: Open a page
      ansible.builtin.uri:
        url: "http://127.0.0.1:9333/json/new?data:text/html,{{ '<title>rendered-under-noexec</title>' | urlencode }}"
        method: PUT

    - name: Check the page rendered
      ansible.builtin.uri:
        url: http://127.0.0.1:9333/json/list
      register: test_pages
      until: test_pages.json | selectattr('title', 'equalto', 'rendered-under-noexec') | list | length > 0
      retries: 30
      delay: 1
