---
# One case from converge.yml (test_case comes from its import): run facts and
# preflight with the case's settings, then check the outcome on each host.
- name: Preflight case | {{ test_case.name | default('') }}
  hosts: kibana
  become: true
  gather_facts: true
  vars_files:
    - vars/shared.yml
  tasks:
    # Facts outlive the play, so clear the previous case's outcome.
    - name: Reset the outcome | {{ test_case.name }}
      ansible.builtin.set_fact:
        test_failed: false
        test_failed_task: ""
        test_failure: ""
        test_failure_raw: ""

    - name: Run the role's preflight | {{ test_case.name }}
      vars:
        kibana_version: "{{ test_case.version | default(test_version) }}"
        kibana_supported_distributions: "{{ test_case.distributions | default(['RedHat', 'AlmaLinux', 'Rocky']) }}"
        kibana_group: "{{ test_case.group | default('kibana') }}"
        kibana_repo_source: "{{ test_case.repo_source | default('elastic') }}"
        kibana_satellite_repo_id: "{{ test_case.satellite_repo_id | default('') }}"
        kibana_node_roles: "{{ test_case.node_roles | default(['background_tasks', 'ui']) }}"
        kibana_max_old_space_size_mb: "{{ test_case.heap | default('') }}"
        kibana_elasticsearch_hosts: "{{ test_case.es_hosts | default(['https://192.0.2.10:9200']) }}"
        kibana_elasticsearch_auth: "{{ test_case.auth | default('service_account_token') }}"
        kibana_elasticsearch_service_account_token: "{{ test_case.token | default(test_token) }}"
        kibana_elasticsearch_username: "{{ test_case.username | default('kibana_system') }}"
        kibana_elasticsearch_password: "{{ test_case.password | default('') }}"
        kibana_elasticsearch_manage_password: "{{ test_case.manage_password | default(false) }}"
        kibana_security_encryption_key: "{{ test_case.security_key | default(test_key) }}"
        kibana_encrypted_saved_objects_encryption_key: "{{ test_key }}"
        kibana_reporting_encryption_key: "{{ test_case.reporting_key | default('') }}"
        kibana_firewall_ports: "{{ test_case.firewall_ports | default([]) }}"
        kibana_selinux_manage: "{{ test_case.selinux_manage | default('auto') }}"
        ssl_certificates: "{{ test_case.ssl_certificates | default(test_ssl_certificates) }}"
      block:
        - name: Gather the role's facts | {{ test_case.name }}
          ansible.builtin.include_role:
            name: "{{ test_role }}"
            tasks_from: facts

        - name: Run the preflight checks | {{ test_case.name }}
          ansible.builtin.include_role:
            name: "{{ test_role }}"
            tasks_from: preflight

      rescue:
        # A run_once check fails every host, but only the host it ran on gets
        # its result; the others may see no failed result at all.
        - name: Record the failure | {{ test_case.name }}
          ansible.builtin.set_fact:
            test_failed: true
            test_failed_task: "{{ ansible_failed_task.name | default('') }}"
            test_failure: >-
              {{ ([ansible_failed_result | default({})] + (ansible_failed_result.results | default([])))
                 | selectattr('msg', 'defined') | map(attribute='msg') | join(' ') }}
            test_failure_raw: "{{ ansible_failed_result | default({}) | to_json }}"

    # Checks marked no_log hide their message, so the failed task's name says
    # which check refused the settings. For a run_once check, that is only
    # known on the first host.
    - name: Check the outcome | {{ test_case.name }}
      vars:
        test_should_fail: "{{ test_case.task | length > 0 and inventory_hostname in (test_case.fail_on | default(ansible_play_hosts_all)) }}"
        test_check_detail: "{{ not (test_case.run_once | default(false)) or inventory_hostname == test_first }}"
        test_leaked: "{{ test_secrets | select('in', test_failure_raw) | list }}"
      ansible.builtin.assert:
        that:
          - test_failed == test_should_fail
          - not test_failed or not test_check_detail or test_failed_task == 'Preflight | ' ~ test_case.task
          - not test_failed or not test_check_detail or test_failure is search(test_case.expect | default(''))
          - test_leaked | length == 0
        fail_msg: >-
          Case '{{ test_case.name }}' on {{ inventory_hostname }}: expected
          {{ ('a failure in "Preflight | ' ~ test_case.task ~ '"') if test_should_fail else 'no failure' }},
          got {{ ('a failure in "' ~ test_failed_task ~ '": ' ~ test_failure) if test_failed else 'none' }}.
          {{ 'The failure printed a secret.' if test_leaked | length > 0 else '' }}
        quiet: true

    # A run_once failure leaves the other hosts marked failed although their
    # rescue ran; without this they would sit out every later case.
    - name: Bring every host back for the next case | {{ test_case.name }}
      ansible.builtin.meta: clear_host_errors
