---
# Three systemd containers (rootless Podman is fine) on one network:
#   kes-1       Elasticsearch, single node, installed by prepare.yml
#   kb-1, kb-2  the inventory group "kibana", which the role is applied to
# MOLECULE_DISTRO picks the EL release (default rockylinux9; also
# rockylinux10) — see the README's "Testing" section. The playbooks and
# inventory here are shared with the other scenarios.
#
# Inside containers SELinux is off and firewalld isn't installed, so this
# exercises the role's skip paths for both.
#
# The sequence adds `check` (converge in check mode on the converged hosts)
# after the idempotence check, and side_effect.yml (restarts) before verify.
role_name_check: 1

dependency:
  name: galaxy   # installs requirements.yml next to this file

driver:
  name: podman

platforms:
  - name: kes-1
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    pre_build_image: true
    override_command: false   # keep the image's own CMD: systemd as PID 1
    systemd: always
    network: kibana_molecule  # created by the driver from the first platform
    groups: [elasticsearch]

  - name: kb-1
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    pre_build_image: true
    override_command: false
    systemd: always
    network: kibana_molecule
    groups: [kibana]

  - name: kb-2
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    pre_build_image: true
    override_command: false
    systemd: always
    network: kibana_molecule
    groups: [kibana]

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: inventory/group_vars/

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - check
    - side_effect
    - verify
    - destroy
