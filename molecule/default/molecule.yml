---
# Tests run on the Proxmox test lab: three real KVM VMs cloned from the lab
# fleet onto the isolated labnet network — SELinux enforcing and firewalld
# running, the paths containers could never exercise. One Elasticsearch node
# plus two Kibana instances; the groups (elasticsearch, kibana) are what the
# playbooks and inventory address. The driver connects as a sudo user, and
# inventory/group_vars/all.yml sets ansible_become so the plays run as root.
#
# All Proxmox connection details live in the driver's secrets file on the
# control machine, not here. Default VMIDs are the repo's 9270-9272 band, via
# LAB_VMID_0/1/2 so the lab's `mlab` runner can claim a free band per run and
# allow parallel runs of this repo; a plain molecule test uses the pinned band,
# one lab run of this repo at a time.
#
# Run on the lab's molecule control machine:
#   /root/labnet/mlab test -s default              # parallel-safe, recommended
#   molecule test                                  # pinned band
#   LAB_TEMPLATE=template-alma10 molecule test     # the other EL release
#   LAB_TEMPLATE=template-alma8 molecule test
#   LAB_TEMPLATE=template-ubuntu-2404 molecule test
#
# The sequence adds `check` (converge in check mode on the converged hosts)
# after the idempotence check, and side_effect.yml (restarts) before verify.
role_name_check: 1

dependency:
  name: galaxy
  enabled: false        # collections preinstalled on the control machine
prerun: false

driver:
  name: molecule-proxmox
  options:
    proxmox_secrets: ${LAB_PROXMOX_SECRETS:-/root/.config/molecule/proxmox-secrets.yml}
    node: ${LAB_NODE:-galactica}
    validate_certs: false   # the lab's PVE uses its self-signed cert
    ssh_user: labadmin
    ssh_identity_file: /root/.ssh/id_ed25519
    full: true
    pool: testlab
    timeout: 300

platforms:
  - name: kibana-default-es
    template_name: ${LAB_TEMPLATE:-template-alma9}
    newid: ${LAB_VMID_0:-9270}
    groups: [elasticsearch]
    memory: 6144          # Elasticsearch heap plus page cache (driver patch)
    cores: 2

  - name: kibana-default-kb1
    template_name: ${LAB_TEMPLATE:-template-alma9}
    newid: ${LAB_VMID_1:-9271}
    groups: [kibana]
    memory: 3072
    cores: 2

  - name: kibana-default-kb2
    template_name: ${LAB_TEMPLATE:-template-alma9}
    newid: ${LAB_VMID_2:-9272}
    groups: [kibana]
    memory: 3072
    cores: 2

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/..:/root/.ansible/roles"

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - check
    - side_effect
    - verify
    - destroy
