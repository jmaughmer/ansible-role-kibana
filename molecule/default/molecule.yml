---
# Three systemd containers (rootless Podman is fine) on one network:
#   kibana-default-es   Elasticsearch, single node, installed by prepare.yml
#   kibana-default-kb1  the inventory group "kibana", which the role is
#   kibana-default-kb2  applied to
# The playbooks and inventory find the hosts by group, and every scenario
# names its hosts and network after itself, so scenarios can run at the same
# time.
# MOLECULE_EL picks the AlmaLinux release of the almalinux/<release>-init
# image (default 9; also 10) — see the README's "Testing" section. The
# playbooks and inventory here are shared with the other scenarios. Ansible
# connects as root, so the playbooks do not use become: the images have no
# sudo.
#
# Inside containers SELinux is off and firewalld isn't installed, so this
# exercises the role's skip paths for both.
#
# The sequence adds `check` (converge in check mode on the converged hosts)
# after the idempotence check, and side_effect.yml (restarts) before verify.
role_name_check: 1

dependency:
  name: galaxy   # installs requirements.yml next to this file

driver:
  name: podman

platforms:
  - name: kibana-default-es
    image: "docker.io/almalinux/${MOLECULE_EL:-9}-init:latest"
    pre_build_image: true
    override_command: false   # keep the image's own CMD: systemd as PID 1
    systemd: always
    network: kibana_default  # created by the driver from the first platform
    groups: [elasticsearch]

  - name: kibana-default-kb1
    image: "docker.io/almalinux/${MOLECULE_EL:-9}-init:latest"
    pre_build_image: true
    override_command: false
    systemd: always
    network: kibana_default
    groups: [kibana]

  - name: kibana-default-kb2
    image: "docker.io/almalinux/${MOLECULE_EL:-9}-init:latest"
    pre_build_image: true
    override_command: false
    systemd: always
    network: kibana_default
    groups: [kibana]

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: inventory/group_vars/

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - check
    - side_effect
    - verify
    - destroy
