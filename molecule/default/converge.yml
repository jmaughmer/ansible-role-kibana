---
# kibana_elasticsearch_hosts is built from the Elasticsearch node's address,
# so its facts are gathered first. The role is applied to every Kibana instance
# in one play, as in examples/playbook.yml, and included by the repository's
# path, which works whatever the roles path is.
- name: Gather facts from every host
  hosts: all
  gather_facts: true
  tasks: []

- name: Converge
  hosts: kibana
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Apply the role
      ansible.builtin.include_role:
        name: "{{ test_role_dir }}"
